{% extends "catalog/base.html" %}

{% block title %}Register - Online Library{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="feature-icon" style="width: 60px; height: 60px; font-size: 1.5rem;">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-muted">Join our library community today</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label fw-semibold">
                                <i class="fas fa-user me-2"></i>Username
                            </label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" 
                                   placeholder="Choose username" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-semibold">
                                <i class="fas fa-envelope me-2"></i>Email
                            </label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" 
                                   placeholder="your@email.com" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label fw-semibold">
                                <i class="fas fa-id-card me-2"></i>First Name
                            </label>
                            <input type="text" class="form-control form-control-lg" id="first_name" name="first_name" 
                                   placeholder="Your first name">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label fw-semibold">
                                <i class="fas fa-id-card me-2"></i>Last Name
                            </label>
                            <input type="text" class="form-control form-control-lg" id="last_name" name="last_name" 
                                   placeholder="Your last name">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password1" class="form-label fw-semibold">
                                <i class="fas fa-lock me-2"></i>Password
                            </label>
                            <input type="password" class="form-control form-control-lg" id="password1" name="password1" 
                                   placeholder="Create password" required>
                        </div>
                        
                        <div class="col-md-6 mb-4">
                            <label for="password2" class="form-label fw-semibold">
                                <i class="fas fa-lock me-2"></i>Confirm Password
                            </label>
                            <input type="password" class="form-control form-control-lg" id="password2" name="password2" 
                                   placeholder="Confirm password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-gradient btn-lg w-100 py-3">
                        <i class="fas fa-user-plus me-2"></i>Create Account
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0">Already have an account? 
                        <a href="{% url 'login' %}" class="text-decoration-none fw-semibold">Sign in here</a>
                    </p>
                    <a href="{% url 'home' %}" class="text-decoration-none">
                        <i class="fas fa-arrow-left me-1"></i>Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
